<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const GRAVITY = 0.6;
  const GROUND_Y = 360;
  const MONSTER_BONUS_HP = 45;

  // ==================== WEB AUDIO API SOUND & BGM ENGINE ====================
  let audioCtx = null;
  let soundMuted = false;
  let bgmInterval = null;
  let bgmStep = 0;

  function ensureAudioContext() {
    if (soundMuted) return null;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {
      });
    }
    return audioCtx;
  }

  function toggleSoundMute() {
    soundMuted = !soundMuted;
    if (soundMuted) {
      stopBGM();
    } else {
      if (gameState === "fight" || gameState === "zombie") {
        startBGM();
      }
    }
    spawnFloatingText(
            canvas.width / 2,
            85,
            soundMuted ? "ĐÃ TẮT ÂM THANH & NHẠC [N]" : "ĐÃ BẬT ÂM THANH & NHẠC [N]",
            soundMuted ? "#ff6b6b" : "#74c69d",
            14
    );
  }

  // --- BGM SYNTHESIZER (ARCADE ACTION) ---
  const BGM_BASS_LINE = [130.81, 130.81, 155.56, 174.61, 196.00, 174.61, 155.56, 146.83];
  const BGM_MELODY_LINE = [523.25, 0, 659.25, 587.33, 783.99, 0, 659.25, 523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 0];

  function playBGMTick() {
    if (soundMuted) return;
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;

    const now = ctxInstance.currentTime;

    const bassFreq = BGM_BASS_LINE[bgmStep % BGM_BASS_LINE.length];
    if (bassFreq > 0) {
      const osc = ctxInstance.createOscillator();
      const gain = ctxInstance.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(bassFreq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(ctxInstance.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    const melFreq = BGM_MELODY_LINE[bgmStep % BGM_MELODY_LINE.length];
    if (melFreq > 0) {
      const osc = ctxInstance.createOscillator();
      const gain = ctxInstance.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(melFreq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.035, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(ctxInstance.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    bgmStep++;
  }

  function startBGM() {
    if (bgmInterval || soundMuted) return;
    bgmStep = 0;
    bgmInterval = setInterval(playBGMTick, 145);
  }

  function stopBGM() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function playDrawSound() {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;
    const notes = [392.00, 349.23];

    notes.forEach((freq, idx) => {
      const start = now + idx * 0.14;
      const osc = ctxInstance.createOscillator();
      const gain = ctxInstance.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.15, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

      osc.connect(gain);
      gain.connect(ctxInstance.destination);
      osc.start(start);
      osc.stop(start + 0.23);
    });
  }

  // --- SOUND EFFECTS ---
  function createNoiseBuffer(ctxInstance, duration) {
    const sampleRate = ctxInstance.sampleRate;
    const length = Math.max(1, Math.floor(sampleRate * duration));
    const buffer = ctxInstance.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  function playJumpSound() {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;

    const osc = ctxInstance.createOscillator();
    const gain = ctxInstance.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(165, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.11);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

    osc.connect(gain);
    gain.connect(ctxInstance.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  function playHitSound(isHeavy = false) {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;
    const duration = isHeavy ? 0.16 : 0.09;

    const osc = ctxInstance.createOscillator();
    const gain = ctxInstance.createGain();
    osc.type = isHeavy ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(isHeavy ? 145 : 210, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + duration);

    gain.gain.setValueAtTime(isHeavy ? 0.22 : 0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(ctxInstance.destination);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

    notes.forEach((freq, idx) => {

      osc.connect(gain);

      osc.stop(start + 0.15);

  }

  function playWaveClearSound() {

    notes.forEach((freq, idx) => {

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.15, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.16);

      osc.connect(gain);
      gain.connect(ctxInstance.destination);
      osc.start(start);
      osc.stop(start + 0.17);
    });
  }

  function playSlashSound() {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;
    const duration = 0.12;

    const noise = ctxInstance.createBufferSource();
    noise.buffer = createNoiseBuffer(ctxInstance, duration);

    const filter = ctxInstance.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.setValueAtTime(2.6, now);
    filter.frequency.setValueAtTime(1400, now);
    filter.frequency.exponentialRampToValueAtTime(340, now + duration);

    const gain = ctxInstance.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.24, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctxInstance.destination);

    noise.start(now);
    noise.stop(now + duration);
  }

  function playGunSound(isArrow = false) {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;

    const duration = isArrow ? 0.09 : 0.11;
    const noise = ctxInstance.createBufferSource();
    noise.buffer = createNoiseBuffer(ctxInstance, duration);

    const filter = ctxInstance.createBiquadFilter();
    filter.type = isArrow ? "bandpass" : "highpass";
    filter.frequency.setValueAtTime(isArrow ? 950 : 650, now);
    filter.frequency.exponentialRampToValueAtTime(isArrow ? 320 : 190, now + duration);

    const noiseGain = ctxInstance.createGain();
    noiseGain.gain.setValueAtTime(isArrow ? 0.14 : 0.25, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctxInstance.destination);
    noise.start(now);
    noise.stop(now + duration);

    const osc = ctxInstance.createOscillator();
    const oscGain = ctxInstance.createGain();
    osc.type = isArrow ? "triangle" : "sawtooth";
    osc.frequency.setValueAtTime(isArrow ? 260 : 190, now);
    osc.frequency.exponentialRampToValueAtTime(52, now + 0.085);

    oscGain.gain.setValueAtTime(isArrow ? 0.11 : 0.18, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

    osc.connect(oscGain);
    oscGain.connect(ctxInstance.destination);
    osc.start(now);
    osc.stop(now + 0.09);
  }

  function playDragonFireSound(isSpecial = false) {
    const ctxInstance = ensureAudioContext();
    if (!ctxInstance) return;
    const now = ctxInstance.currentTime;
    const duration = isSpecial ? 0.46 : 0.24;

    const noise = ctxInstance.createBufferSource();
    noise.buffer = createNoiseBuffer(ctxInstance, duration);

    const filter = ctxInstance.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.setValueAtTime(isSpecial ? 1.5 : 2.0, now);
    filter.frequency.setValueAtTime(isSpecial ? 520 : 680, now);
    filter.frequency.exponentialRampToValueAtTime(160, now + duration);

    const gain = ctxInstance.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(isSpecial ? 0.34 : 0.22, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctxInstance.destination);
    noise.start(now);
    noise.stop(now + duration);

    const roar = ctxInstance.createOscillator();
    const roarGain = ctxInstance.createGain();
    roar.type = "sawtooth";
    roar.frequency.setValueAtTime(isSpecial ? 135 : 110, now);
    roar.frequency.exponentialRampToValueAtTime(42, now + duration);

    roarGain.gain.setValueAtTime(isSpecial ? 0.2 : 0.11, now);
    roarGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    roar.connect(roarGain);
    roarGain.connect(ctxInstance.destination);
    roar.start(now);
    roar.stop(now + duration);
  }

  function playTntExplosionSound() {

    const filter = ctxInstance.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(920, now);
    filter.frequency.exponentialRampToValueAtTime(85, now + duration);

    const gain = ctxInstance.createGain();
    gain.gain.setValueAtTime(0.38, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctxInstance.destination);
    noise.start(now);
    noise.stop(now + duration);

    const boom = ctxInstance.createOscillator();
    const boomGain = ctxInstance.createGain();
    boom.type = "sine";
    boom.frequency.setValueAtTime(120, now);
    boom.frequency.exponentialRampToValueAtTime(28, now + 0.42);

    boomGain.gain.setValueAtTime(0.32, now);
